services:
  threestudio:
    image: threestudio-gaussians2life:1.0
    build:
      context: ../
      dockerfile: docker/Dockerfile
      args:
        USER_NAME: ${HOST_USER_NAME:-dreamer}
        GROUP_NAME: ${HOST_GROUP_NAME:-dreamers}
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
      shm_size: '4gb'
    environment:
      NVIDIA_DISABLE_REQUIRE: 1
    tty: true
    stdin_open: true
    volumes:
      - ../:/home/${HOST_USER_NAME:-dreamer}/threestudio
      - /home/${HOST_USER_NAME:-dreamer}/threestudio/custom/gaussians2life/.venv
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]